<script>
const zh = (window.CUES || []).map((c) => c.zh).join('') + '被落下的伞';
Promise.all([
  '900 40px "Inter Tight"', '900 40px "Noto Sans SC"', '700 40px "Noto Sans SC"', '500 20px "DM Mono"',
