<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherlock Studio — Editor de Casos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='none' stroke='%23E0B658' stroke-width='2'/%3E%3Cpath d='M5 8h6M5 11h4' stroke='%23E0B658' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="studio">
    <aside id="studio-side">
      <div class="studio-logo">SHERLOCK<span>STUDIO</span></div>
      <div class="studio-case mono" id="studio-case">—</div>
      <nav id="studio-nav"></nav>
      <div class="studio-actions">
        <button class="btn" id="btn-new">✚ NOVO CASO</button>
        <button class="btn" id="btn-validate">✔ VALIDAR</button>
        <button class="btn" id="btn-export-json">⇩ EXPORTAR JSONs</button>
        <button class="btn btn-primary" id="btn-export-zip">⇩ ZIP DO CASO</button>
      </div>
    </aside>
    <main id="studio-main">
      <div id="studio-panel"></div>
      <section id="studio-console" class="panel">
        <div class="console-head">CONSOLE DE VALIDAÇÃO <span id="console-badge" class="row-tag">—</span></div>
        <div id="console-out" class="mono"></div>
      </section>
    </main>
  </div>
  <script type="module" src="editor.js"></script>
</body>
</html>
