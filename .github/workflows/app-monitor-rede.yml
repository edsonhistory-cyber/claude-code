name: App Monitor de Rede (Android)

on:
  push:
    paths:
      - "app-monitor-rede/**"
      - ".github/workflows/app-monitor-rede.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-monitor-rede
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Montar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk MonitorRede.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorRede-apk
          path: app-monitor-rede/MonitorRede.apk

      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monitor-rede-v${{ github.run_number }}
          name: Monitor de Rede v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Baixe o arquivo **MonitorRede.apk** abaixo pelo celular Android e abra para instalar.
            Se o Android avisar "fonte desconhecida", permita a instalação para o navegador.
          files: app-monitor-rede/MonitorRede.apk
